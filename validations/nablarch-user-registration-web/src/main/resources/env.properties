##
## 開発環境用設定ファイル
##

# JDBC接続ドライバクラス
nablarch.db.jdbcDriver=org.h2.Driver

# JDBC接続URL
# 初回DB作成時に extraDdl/h2/01_CREATE_USERS.sql を実行して USERS テーブル等を生成
nablarch.db.url=jdbc:h2:./h2/db/user_registration;AUTO_SERVER=TRUE;INIT=RUNSCRIPT FROM 'classpath:extraDdl/h2/01_CREATE_USERS.sql'

# DB接続ユーザ名 (H2 のデフォルト admin)
nablarch.db.user=sa

# DB接続パスワード
nablarch.db.password=sa

# DBスキーマ名
nablarch.db.schema=PUBLIC

# 最大プールサイズ
nablarch.db.maxPoolSize=5

# 出力ファイルの出力先ディレクトリ
nablarch.filePathSetting.basePathSettings.output=file:./work/output

# アップロードファイルの自動クリーニング
nablarch.uploadSettings.autoCleaning=false

# アップロードファイル一時ディレクトリ
nablarch.filePathSetting.basePathSettings.uploadFileTmpDir=file:./work/tmp
